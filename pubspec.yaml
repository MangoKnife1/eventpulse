name: eventpulse_flutter
description: "EventPulse - Community Event Organizer with Dynamic QR Check-in & Segregated Roles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.1
  # Dynamic QR Code generation for tickets & passes
  qr_flutter: ^4.1.0
  # Date & time formatting
  intl: ^0.19.0
  # Device hardware permission handling
  permission_handler: ^11.3.1
  # Live camera QR & barcode scanner
  mobile_scanner: ^7.4.1
  # Icons & Modern Typography
  google_fonts: ^6.1.0
  # Firebase (Auth + Firestore)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  # Cloudinary image uploads (unsigned upload over HTTP)
  image_picker: ^1.1.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
